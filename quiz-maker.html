<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Maker Panel</title>
    
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script>MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>
    <div class="container">
        
        <div id="view-dashboard">
            <h1 style="text-align:center; color:#3f37c9; margin-bottom:20px;">🎨 কুইজ ড্যাশবোর্ড (Question Maker)</h1>
            <div class="header-actions" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0;">সকল কুইজ তালিকা</h2>
                <button onclick="createNewQuiz()" class="primary-btn">+ নতুন কুইজ তৈরি করুন</button>
            </div>
            <input type="text" id="search-quiz" placeholder="🔍 কুইজের নাম দিয়ে খুঁজুন..." onkeyup="filterQuizzes()" style="padding:12px; border:2px solid #e0e0e0; border-radius:25px; padding-left:20px; width:100%; box-sizing:border-box; margin-bottom:20px;">
            
            <div id="quiz-list-container">
                <p style="text-align:center;">লোডিং হচ্ছে...</p>
            </div>
        </div>

        <div id="view-editor" style="display:none;">
            <div class="sticky-top" style="display:flex; justify-content:space-between; align-items:center;">
                <button onclick="showDashboard()" class="secondary-btn">🔙 ড্যাশবোর্ড</button>
                <h2 style="margin:0; color:#4361ee;">কুইজ এডিটর</h2>
                <button onclick="saveQuizData()" class="primary-btn" style="background:#00b894;">💾 সেভ কুইজ</button>
            </div>

            <div class="editor-grid">
                <div class="editor-left">
                    <div class="section-settings">
                        <h3>⚙️ কুইজ সেটিংস</h3>
                        <input type="hidden" id="quiz-id-input">
                        <label>পরীক্ষার নাম (Title):</label>
                        <input type="text" id="quiz-title-input" placeholder="Ex: Mock Test 1">
                        
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                            <div><label>সময় (মিনিট):</label><input type="number" id="quiz-duration" placeholder="90"></div>
                            <div><label>পাস মার্ক:</label><input type="number" id="quiz-pass-mark" placeholder="30"></div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                            <div><label>প্রতি সঠিক উত্তর (+):</label><input type="number" id="quiz-pos-mark" value="1"></div>
                            <div><label>প্রতি ভুল উত্তর (-):</label><input type="number" id="quiz-neg-mark" value="0.25"></div>
                        </div>
                        <div style="display:flex; gap:15px; margin-top:10px;">
                            <label><input type="checkbox" id="rand-question-check"> প্রশ্ন অদলবদল (Shuffle Questions)</label>
                            <label><input type="checkbox" id="rand-option-check"> অপশন অদলবদল (Shuffle Options)</label>
                        </div>
                    </div>

                    <div class="section-question">
                        <h3>➕ প্রশ্ন যোগ করুন</h3>
                        
                        <label>বিষয় (Subject):</label>
                        <select id="question-subject-select">
                            <option value="General Awareness">General Awareness</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Reasoning">Reasoning</option>
                            <option value="English">English</option>
                        </select>

                        <label>অনুচ্ছেদ (Passage - Optional):</label>
                        <textarea id="passage-input" placeholder="যদি প্যাসেজ থাকে তবে এখানে লিখুন..."></textarea>

                        <label>প্রশ্ন (Question):</label>
                        <div class="rich-toolbar">
                            <button onclick="formatText('bold')" title="Bold"><b>B</b></button>
                            <button onclick="formatText('italic')" title="Italic"><i>I</i></button>
                            <button onclick="formatText('underline')" title="Underline"><u>U</u></button>
                            <button onclick="insertMath('\\frac{a}{b}')" title="Fraction">a/b</button>
                            <button onclick="insertMath('\\sqrt{x}')" title="Square Root">√x</button>
                        </div>
                        <div id="rich-q-text" class="rich-editor" contenteditable="true"></div>

                        <label>প্রশ্নের ছবি (Optional):</label>
                        <input type="file" id="q-img-input" accept="image/*">

                        <div class="options-grid">
                            <div><label>অপশন ১:</label><input type="text" id="o1"></div>
                            <div><label>অপশন ২:</label><input type="text" id="o2"></div>
                            <div><label>অপশন ৩:</label><input type="text" id="o3"></div>
                            <div><label>অপশন ৪:</label><input type="text" id="o4"></div>
                        </div>

                        <label>সঠিক উত্তর (Correct Option):</label>
                        <select id="c-opt">
                            <option value="0">অপশন ১</option>
                            <option value="1">অপশন ২</option>
                            <option value="2">অপশন ৩</option>
                            <option value="3">অপশন ৪</option>
                        </select>

                        <label>ব্যাখ্যা (Explanation):</label>
                        <textarea id="expl-input" placeholder="উত্তর কেন সঠিক তার ব্যাখ্যা..."></textarea>
                        <input type="file" id="expl-img" accept="image/*">

                        <button id="add-question-btn" class="primary-btn" style="width:100%; margin-top:10px;">➕ প্রশ্ন যোগ করুন</button>
                        <button id="update-question-btn" class="primary-btn" style="width:100%; margin-top:10px; background:#ff9800; display:none;">আপডেট করুন</button>
                    </div>

                    <div class="section-bulk">
                        <h3>⚡ বাল্ক ইমপোর্ট (Text)</h3>
                        <textarea id="bulk-input-textarea" placeholder="Question?&#10;Option A&#10;Option B&#10;Option C&#10;Option D&#10;Answer: Option A" style="height:150px;"></textarea>
                        <button id="process-bulk-btn" class="primary-btn" style="background:#9c27b0; color:white; width:100%;">প্রসেস করুন</button>
                    </div>
                </div>

                <div class="editor-right">
                    <div class="section-settings" style="height:100%; display:flex; flex-direction:column; padding:0;">
                        <h3 style="background:#eee; padding:10px; margin:0; border-bottom:1px solid #ddd;">📋 প্রশ্নের তালিকা (Preview)</h3>
                        <div id="questions-container" style="flex:1; padding:10px; overflow-y:auto;"></div>
                        
                        <div class="save-section" style="padding:10px; border-top:1px solid #ddd;">
                             <div id="share-link-box" style="display:none; background:#e8f5e9; padding:10px; border-radius:4px; margin-top:10px;">
                                <label style="font-size:12px; color:#2e7d32;">✅ কুইজ লিংক তৈরি হয়েছে (exam.html):</label>
                                <input type="text" id="generated-link" readonly style="font-size:12px; width:100%;">
                                <button onclick="copyLink()" style="background:#2e7d32; color:white; padding:5px 10px; width:100%; margin-top:5px;">কপি লিংক</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-results" style="display:none;">
            <button onclick="showDashboard()" class="secondary-btn">🔙 ড্যাশবোর্ড</button>
            <h2 id="res-quiz-title">ফলাফল</h2>
            <button onclick="exportToCSV()" class="primary-btn" style="background:#00897b; margin-bottom:10px;">📥 Excel ডাউনলোড</button>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>নাম</th><th>স্কোর</th><th>তারিখ</th></tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
